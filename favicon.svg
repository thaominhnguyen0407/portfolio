  <!-- Outer Side Petals -->
  <path d="M32 49 C18 48 7 41 4 31 C6 25 15 26 24 33 C28 37 31 43 32 49 Z" fill="url(#outerPetalLeft)" stroke="#B88242" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M32 49 C46 48 57 41 60 31 C58 25 49 26 40 33 C36 37 33 43 32 49 Z" fill="url(#outerPetalRight)" stroke="#B88242" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- Mid/Inner Petals -->
  <path d="M32 50 C21 46 13 34 15 22 C20 18 28 23 31 34 C32 38 32 45 32 50 Z" fill="url(#innerPetalLeft)" stroke="#B88242" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="M32 50 C43 46 51 34 49 22 C44 18 36 23 33 34 C32 38 32 45 32 50 Z" fill="url(#innerPetalRight)" stroke="#B88242" stroke-width="1.15" stroke-linejoin="round"/>

  <!-- Center Main Petal -->
  <path d="M32 8 C26 19 23 33 32 51 C41 33 38 19 32 8 Z" fill="url(#centerPetalGrad)" stroke="#A37036" stroke-width="1.25" stroke-linejoin="round"/>

  <!-- Delicate Golden Calyx / Stamen Accent -->
  <ellipse cx="32" cy="46.5" rx="3.5" ry="2" fill="#D4A15A" stroke="#A37036" stroke-width="0.75"/>
  <circle cx="32" cy="46.5" r="1.2" fill="#FFFDF8"/>

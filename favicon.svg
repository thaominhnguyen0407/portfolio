<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Warm Vintage Cream & Pale Blush Pink Gradients -->
    <linearGradient id="centerPetalGrad" x1="32" y1="8" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="45%" stop-color="#FCEEF1"/>
      <stop offset="80%" stop-color="#F5CAD4"/>
      <stop offset="100%" stop-color="#EAA6B6"/>
    </linearGradient>
    <linearGradient id="innerPetalLeft" x1="18" y1="18" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="50%" stop-color="#F8DCE2"/>
      <stop offset="100%" stop-color="#E89EB0"/>
    </linearGradient>
    <linearGradient id="innerPetalRight" x1="46" y1="18" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="50%" stop-color="#F8DCE2"/>
      <stop offset="100%" stop-color="#E89EB0"/>
    </linearGradient>
    <linearGradient id="outerPetalLeft" x1="8" y1="28" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="60%" stop-color="#F3C3CD"/>
      <stop offset="100%" stop-color="#DE8FA1"/>
    </linearGradient>
    <linearGradient id="outerPetalRight" x1="56" y1="28" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="60%" stop-color="#F3C3CD"/>
      <stop offset="100%" stop-color="#DE8FA1"/>
